name: Build & Release

on:
  push:
    branches: [ "main" ]
    paths: [ "android/**", "src/**", "scripts/**", "package.json", ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-open
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 签名密码只存在仓库 Secrets 里。Fork 没有这个 Secret 时会用 debug 签名构建。
      KS_PW: ${{ secrets.KS_PW }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Fetch Node.js runtime (nodejs-mobile)
        run: |
          curl -sL -o /tmp/nm.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          mkdir -p android/app/libnode
          unzip -q /tmp/nm.zip -d android/app/libnode
          rm -rf android/app/libnode/bin/armeabi-v7a android/app/libnode/bin/x86_64

      - name: Bundle gateway source (plain, not obfuscated)
        run: |
          G=android/app/src/main/assets/gateway
          mkdir -p $G
          cp -r src $G/
          cp package.json $G/

      - name: Decrypt signing key
        if: env.KS_PW != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/keystore/release.p12.enc -out android/keystore/release.p12 -pass env:KS_PW

      - name: Build APK (release, signed)
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/AGOpen.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: AGOpen-APK
          path: dist/AGOpen.apk

      - name: Read version
        id: ver
        run: echo "vn=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        if: env.KS_PW != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}
          target_commitish: ${{ github.sha }}
          name: "wag2api v${{ steps.ver.outputs.vn }}"
          make_latest: true
          body: |
            **手机独立版**：下载 `AGOpen.apk` 安装，网关直接在手机上运行，旧版可覆盖升级。

            **Linux 版**：一键安装（systemd，开机自启）
            ```
            curl -fsSL https://raw.githubusercontent.com/zr987459/wag2api/main/scripts/install.sh | sudo bash
            ```
            或直接下载 `wag2api-linux-x64` / `wag2api-linux-arm64`，`chmod +x` 后运行，无需安装 Node。
          files: dist/AGOpen.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Test
        run: npm test
      - name: Build single-file binaries
        run: node scripts/build-linux.mjs x64 arm64
      - name: Smoke test (x64)
        run: |
          HOME=$RUNNER_TEMP PORT=8799 ./dist/wag2api-linux-x64 & sleep 3
          curl -fsS http://127.0.0.1:8799/health
          curl -fsS http://127.0.0.1:8799/ | grep -q wag2api
          kill %1
      - name: Read version
        id: ver
        run: echo "vn=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wag2api-linux
          path: dist/wag2api-linux-*
      - name: Attach to release
        if: github.repository == 'zr987459/wag2api'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vn }}
          target_commitish: ${{ github.sha }}
          name: "wag2api v${{ steps.ver.outputs.vn }}"
          files: |
            dist/wag2api-linux-x64
            dist/wag2api-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
