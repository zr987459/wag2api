name: Build wag2api

on:
  push:
    branches: [main, 'refactor/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 1. 引擎与路由单测
  # ─────────────────────────────────────────────
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node 引擎测试
        working-directory: .
        run: npm test

      - name: Dockerfile 冒烟构建测试
        run: docker build -t wag2api:smoke .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # 轻量编译检查：只编译 Kotlin，不打包不签名，约 40 秒
      # 这样推 main 也能拦住编译错误，不必等打 tag 才发现
      - name: Kotlin 编译检查
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin --no-daemon --console=plain

  # ─────────────────────────────────────────────
  # 2. APK：v2 只出一个 wag2api.apk（没有 Node，AG 引擎是 Kotlin）
  # ─────────────────────────────────────────────
  apk:
    # 打 tag、手动触发、或推 refactor/** 分支时出包；main 分支只做轻量编译检查
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/'))
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      # AIS 前端（web）构建要用 Node；APK 本身不再带 Node
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 AIS 二进制
        uses: actions/cache@v4
        id: ais-cache
        with:
          path: app/app/src/main/jniLibs/arm64-v8a/libaistudio2api.so
          key: ais-${{ hashFiles('ais/UPSTREAM_SHA', 'ais/android.patch') }}-sm-v3-slim

      # M7：-tags wag2api 排除内置 Web UI、selfupdate、MCP 客户端、AAC/Opus/FLAC 编码器（见 ais/android.patch）；
      # -Wl,--gc-sections 让链接器丢掉 SpiderMonkey 静态库里没被引用的函数段。
      # 不再构建 AIS 前端（web/），wag2api 有自己的控制台。
      - name: 编译 AIS 引擎
        if: steps.ais-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone https://github.com/Mag1cFall/AIStudio2API.git /tmp/ais
          git -C /tmp/ais checkout $(cat ais/UPSTREAM_SHA)
          git -C /tmp/ais apply "$GITHUB_WORKSPACE/ais/android.patch"
          mkdir -p app/app/src/main/jniLibs/arm64-v8a
          # v0.2.18 起 WAA 用 SpiderMonkey（cgo），按上游 Dockerfile 用 zig 交叉编译为全静态 musl arm64，可直接在安卓上运行
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C /tmp && mv /tmp/zig-x86_64-linux-0.16.0 /tmp/zig
          SM=v152.0.4-aistudio2api.1
          mkdir -p /tmp/sm && curl -fsSL "https://github.com/Mag1cFall/firefox/releases/download/$SM/spidermonkey-$SM-linux-arm64.tar.gz" | tar -xz -C /tmp/sm
          export CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            CC="/tmp/zig/zig cc -target aarch64-linux-musl" CXX="/tmp/zig/zig c++ -target aarch64-linux-musl" \
            CGO_CXXFLAGS=-I/tmp/sm/include CGO_LDFLAGS=-L/tmp/sm/lib
          TAGS=netgo,osusergo,wag2api
          OUT="$GITHUB_WORKSPACE/app/app/src/main/jniLibs/arm64-v8a/libaistudio2api.so"
          (cd /tmp/ais && go build -trimpath -tags $TAGS \
            -ldflags="-s -w -linkmode external -extldflags '-static -Wl,--strip-all -Wl,--gc-sections'" \
            -o "$OUT" ./cmd/aistudio2api)
          file "$OUT" || true
          echo "### AIS .so：$(( $(stat -c %s "$OUT") / 1024 )) KB（瘦身前 v0.2.18 约 77585 KB）" >> "$GITHUB_STEP_SUMMARY"

          # ── 体积构成分析（只打印到日志，不影响产物）──
          # 同样参数但不 strip 再链接一份（编译缓存复用，只多一次链接），供 go tool nm 使用
          (cd /tmp/ais && go build -trimpath -tags $TAGS \
            -ldflags="-linkmode external -extldflags '-static -Wl,--gc-sections'" \
            -o /tmp/ais-sym.so ./cmd/aistudio2api)
          echo "::group::AIS 体积构成"
          echo "== 产物：$(stat -c %s "$OUT") 字节；未 strip 分析副本：$(stat -c %s /tmp/ais-sym.so) 字节"
          echo "== SpiderMonkey 静态库"; ls -l /tmp/sm/lib
          echo "== 嵌入资源（//go:embed）"
          (cd /tmp/ais && grep -rn --include='*.go' '^//go:embed' internal cmd | grep -v _test | while IFS= read -r line; do
              f=${line%%:*}; d=$(dirname "$f"); for pat in ${line#*//go:embed }; do pat=${pat#all:}; for m in $d/$pat; do
                [ -e "$m" ] && printf '%10s  %s  (%s)\n' "$(du -sb "$m" | cut -f1)" "$m" "$f"; done; done; done)
          echo "   注：internal/webui/dist 与 internal/desktop 在 wag2api tag 下不参与编译"
          go tool nm -size -sort size /tmp/ais-sym.so > /tmp/nm.txt
          python3 - "$OUT" /tmp/ais-sym.so /tmp/nm.txt <<'PY'
          import sys, struct, re, collections
          def sections(path):
              f = open(path, 'rb').read()
              shoff = struct.unpack_from('<Q', f, 0x28)[0]
              ent, num, stri = struct.unpack_from('<HHH', f, 0x3A)
              secs = [struct.unpack_from('<IIQQQQIIQQ', f, shoff + i * ent) for i in range(num)]
              so = secs[stri][4]
              name = lambda o: f[so + o:f.index(b'\0', so + o)].decode()
              return len(f), [(name(s[0]), s[5], s[1] == 8) for s in secs if s[5]]
          total, secs = sections(sys.argv[1])
          print("== ELF 段（产物）")
          for n, sz, nobits in sorted(secs, key=lambda x: -x[1]):
              print("%12d %5.1f%%  %-20s %s" % (sz, 100 * sz / total, n, "(NOBITS，不占文件)" if nobits else ""))
          rows = []
          for l in open(sys.argv[3]):
              p = l.split(None, 3)
              if len(p) == 4 and p[1].isdigit():
                  rows.append((int(p[1]), p[0], p[2], p[3].strip()))
          print("== go tool nm -size -sort size 前 40")
          for sz, addr, t, n in rows[:40]:
              print("%10d %s %s" % (sz, t, n[:150]))
          # ICU 数据在 nm 里大小为 0，用下一个符号地址推算
          addrs = sorted({int(a, 16) for _, a, _, _ in rows})
          for sz, a, t, n in rows:
              if n.startswith('icudt') and n.endswith('_dat'):
                  ai = int(a, 16); nxt = next((x for x in addrs if x > ai), ai)
                  print("== SpiderMonkey 内置 ICU 数据 %s ≈ %d 字节" % (n, nxt - ai))
          def pkg(n):
              if n.startswith(('_Z', 'js::', 'JS_', 'mz_', 'icu', 'u_', 'ucase', 'ubidi')) or 'mozilla' in n:
                  return '[C++ SpiderMonkey/ICU/Rust]'
              if n.startswith(('go:', 'type:')):
                  return '[' + n.split('.')[0].split(':')[0] + ':]'
              m = re.match(r'^((?:[\w.\-~]+/)*[\w\-~]+)\.', n)
              if not m:
                  return '[C 其它 (sqlite/musl/...)]'
              return m.group(1)
          agg = collections.Counter(); fileagg = collections.Counter()
          for sz, a, t, n in rows:
              k = pkg(n); agg[k] += sz
              if t not in 'bB':
                  fileagg[k] += sz
          print("== 按包汇总（不含 BSS，前 50）")
          tot = sum(fileagg.values())
          for k, v in fileagg.most_common(50):
              print("%10d %5.1f%%  %s" % (v, 100 * v / tot, k))
          mod = collections.Counter()
          for k, v in fileagg.items():
              m = re.match(r'^(github\.com/[^/]+/[^/]+|golang\.org/x/[^/]+|gopkg\.in/[^/]+|google\.golang\.org/[^/]+)', k)
              mod[m.group(1) if m else ('[std]' if not k.startswith('[') else k)] += v
          print("== 按模块汇总（不含 BSS，前 30）")
          for k, v in mod.most_common(30):
              print("%10d %5.1f%%  %s" % (v, 100 * v / tot, k))
          print("注：.gopclntab / .go.type / ICU 数据 等不按符号计，符号合计仅为参考")
          PY
          echo "::endgroup::"

      # keystore：有 Secret 就用正式签名，没有就退回 debug
      - name: 解密 keystore
        env:
          KS_PW: ${{ secrets.KS_PW }}
        run: |
          if [ -z "$KS_PW" ]; then
            echo "::error::缺少 KS_PW，无法解密固定签名密钥，会导致每次签名不同、无法覆盖安装"
            exit 1
          fi
          mkdir -p app/keystore
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/signing/release.p12.enc \
            -out app/keystore/release.p12 -pass env:KS_PW
          echo "密钥已解密"

      - name: 构建 release
        working-directory: app
        env:
          KS_PW: ${{ secrets.KS_PW }}
          KS_ALIAS: ag
        run: |
          set -e
          chmod +x gradlew
          if [ ! -f keystore/release.p12 ]; then
            echo "::error::未找到解密的密钥库，无法保证固定签名"
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 签名硬校验：证书指纹必须与仓库变量一致，否则失败
      - name: 校验签名
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/app/build/outputs/apk/release/*.apk | head -1)
          SHA=$("$BT" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "cert: $SHA"
          if [ -n "$EXPECTED" ]; then
            if [ "$SHA" != "$EXPECTED" ]; then
              echo "::error::签名指纹与 RELEASE_CERT_SHA256 不一致，会导致无法覆盖安装"
              exit 1
            fi
            echo "签名指纹校验通过"
          else
            echo "::notice::未配置 RELEASE_CERT_SHA256，已跳过指纹比对"
          fi
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}

      - name: 检查产物结构与体积
        run: |
          set -e
          APK=$(ls app/app/build/outputs/apk/release/*.apk | head -1)
          echo "apk: $APK"
          if ! unzip -l "$APK" | grep -q 'lib/arm64-v8a/libaistudio2api.so'; then
            echo "::error::APK 缺少 libaistudio2api.so"; exit 1
          fi
          if unzip -l "$APK" | grep -q 'libnode.so'; then
            echo "::error::v2 APK 不应包含 libnode.so"; exit 1
          fi
          if unzip -l "$APK" | grep -q 'assets/gateway/'; then
            echo "::error::v2 APK 不应包含 Node 源码 assets/gateway"; exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          echo "APK 体积: $((SIZE / 1024)) KB"
          echo "### APK 体积：$((SIZE / 1024)) KB（目标 ≤ 10240 KB）" >> "$GITHUB_STEP_SUMMARY"
          unzip -lv "$APK" | sort -k1 -n -r | head -15 >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$SIZE" -gt 10485760 ]; then
            echo "::warning::APK 超过 10MB 目标（$((SIZE / 1024)) KB）"
          fi
          echo "结构检查通过"

      - name: 重命名
        run: |
          set -e
          mkdir -p dist
          cp $(ls app/app/build/outputs/apk/release/*.apk | head -1) dist/wag2api.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  # ─────────────────────────────────────────────
  # 3. Linux 单文件 + Node 轻量包
  # ─────────────────────────────────────────────
  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: 构建 Linux 产物
        working-directory: .
        run: node scripts/build-linux.mjs x64 arm64

      - name: 压缩单文件 + 打包 Node 轻量包
        working-directory: .
        run: |
          set -e
          for a in x64 arm64; do
            [ -f "dist/wag2api-linux-$a" ] && xz -9e -T0 -k "dist/wag2api-linux-$a"
          done
          cp -r app/app/src/main/assets/web src/web
          tar czf dist/wag2api-node.tar.gz src package.json LICENSE
          rm -rf src/web
          ls -la dist

      # 单文件版没有 --version/--help，直接启动后探活再杀掉
      - name: 冒烟测试
        working-directory: .
        run: |
          set +e
          chmod +x dist/wag2api-linux-x64
          DATA_DIR=/tmp/smoke PORT=18799 HOST=127.0.0.1 NO_AUTH=1 \
            ./dist/wag2api-linux-x64 > /tmp/smoke.log 2>&1 &
          APP_PID=$!
          OK=0
          for i in $(seq 1 20); do
            sleep 1
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18799/v1/models)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
          done
          kill $APP_PID 2>/dev/null
          wait $APP_PID 2>/dev/null
          cat /tmp/smoke.log
          if [ "$OK" = "1" ]; then
            echo "✅ 单文件版冒烟测试通过"
          else
            echo "::warning::单文件版冒烟测试未通过（不阻塞发布）"
          fi
          exit 0

      # 只上传压缩后的单文件和 Node 轻量包，原始二进制太大
      - name: 清理未压缩二进制
        run: rm -f dist/wag2api-linux-x64 dist/wag2api-linux-arm64 && ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ─────────────────────────────────────────────
  # 4. 发布：只在打 tag 时跑，且只调一次 action-gh-release
  # ─────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [apk, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 校验 tag 与版本号一致
        run: |
          set -e
          TAG=${GITHUB_REF_NAME#v}
          FILE_VER=$(grep '^VERSION_NAME=' app/version.properties | cut -d= -f2 | tr -d ' ')
          echo "tag=$TAG file=$FILE_VER"
          if [ "$TAG" != "$FILE_VER" ]; then
            echo "::error::tag ($TAG) 与 version.properties ($FILE_VER) 不一致"
            exit 1
          fi

      - name: 汇总产物并生成校验和
        run: |
          set -e
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.xz' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v2.* 在测试阶段一律发预发布
          prerelease: ${{ startsWith(github.ref_name, 'v2.') }}
