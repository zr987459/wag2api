name: Build wag2api

on:
  push:
    branches: [main, 'refactor/**', 'proto/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 1. 引擎与路由单测
  # ─────────────────────────────────────────────
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node 引擎测试
        working-directory: .
        run: npm test

      - name: Dockerfile 冒烟构建测试
        run: docker build -t wag2api:smoke .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # 轻量编译检查：只编译 Kotlin，不打包不签名，约 40 秒
      # 这样推 main 也能拦住编译错误，不必等打 tag 才发现
      - name: Kotlin 编译检查
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin --no-daemon --console=plain

      # JVM 单测（app/app/src/test）：
      #  - AIS（WebView 版）：storage-state 解析、请求体构造、流式响应解析
      #  - AG 引擎（Kotlin）：协议转换 / SSE 解析 / usage 记账 / Schema 清洗 / 数据目录迁移（移植自 tests/*.mjs）
      - name: JVM 单测（AIS + AG）
        working-directory: app
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --console=plain

      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/app/build/reports/tests/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 2. APK：v2 只出一个 wag2api.apk（没有 Node 和 .so：AG 引擎是 Kotlin，AIS 是系统 WebView）
  # ─────────────────────────────────────────────
  apk:
    # 打 tag、手动触发、或推 refactor/** 分支时出包；main 分支只做轻量编译检查
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/refactor/') || startsWith(github.ref, 'refs/heads/proto/')))
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # keystore：有 Secret 就用正式签名，没有就退回 debug
      - name: 解密 keystore
        env:
          KS_PW: ${{ secrets.KS_PW }}
        run: |
          if [ -z "$KS_PW" ]; then
            echo "::error::缺少 KS_PW，无法解密固定签名密钥，会导致每次签名不同、无法覆盖安装"
            exit 1
          fi
          mkdir -p app/keystore
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/signing/release.p12.enc \
            -out app/keystore/release.p12 -pass env:KS_PW
          echo "密钥已解密"

      # [P4] 控制台静态资源压缩（只改 CI 工作区副本；脚本内核对顶层函数名，不改行为）
      - name: 压缩控制台静态资源
        run: bash .github/scripts/minify-web.sh

      - name: 构建 release
        working-directory: app
        env:
          KS_PW: ${{ secrets.KS_PW }}
          KS_ALIAS: ag
        run: |
          set -e
          chmod +x gradlew
          if [ ! -f keystore/release.p12 ]; then
            echo "::error::未找到解密的密钥库，无法保证固定签名"
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 签名硬校验：证书指纹必须与仓库变量一致，否则失败
      - name: 校验签名
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/app/build/outputs/apk/release/*.apk | head -1)
          SHA=$("$BT" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "cert: $SHA"
          if [ -n "$EXPECTED" ]; then
            if [ "$SHA" != "$EXPECTED" ]; then
              echo "::error::签名指纹与 RELEASE_CERT_SHA256 不一致，会导致无法覆盖安装"
              exit 1
            fi
            echo "签名指纹校验通过"
          else
            echo "::notice::未配置 RELEASE_CERT_SHA256，已跳过指纹比对"
          fi
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}

      - name: 检查产物结构与体积
        run: |
          set -e
          APK=$(ls app/app/build/outputs/apk/release/*.apk | head -1)
          echo "apk: $APK"
          # AIS 是系统 WebView 实现，APK 里不应有任何原生库
          if unzip -l "$APK" | grep -qE 'lib/[^/]+/.*\.so$'; then
            echo "::error::APK 不应包含 .so（AIS 已改为 WebView 实现）"; unzip -l "$APK" | grep '\.so$'; exit 1
          fi
          if unzip -l "$APK" | grep -q 'libnode.so'; then
            echo "::error::v2 APK 不应包含 libnode.so"; exit 1
          fi
          if unzip -l "$APK" | grep -q 'assets/gateway/'; then
            echo "::error::v2 APK 不应包含 Node 源码 assets/gateway"; exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          echo "APK 体积: $((SIZE / 1024)) KB"
          echo "### APK 体积：$((SIZE / 1024)) KB（目标 ≤ 10240 KB）" >> "$GITHUB_STEP_SUMMARY"
          unzip -lv "$APK" | sort -k1 -n -r | head -15 >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$SIZE" -gt 10485760 ]; then
            echo "::warning::APK 超过 10MB 目标（$((SIZE / 1024)) KB）"
          fi
          echo "结构检查通过"

      - name: 重命名
        run: |
          set -e
          mkdir -p dist
          cp $(ls app/app/build/outputs/apk/release/*.apk | head -1) dist/wag2api.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  # ─────────────────────────────────────────────
  # 3. Linux 单文件 + Node 轻量包
  # ─────────────────────────────────────────────
  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: 构建 Linux 产物
        working-directory: .
        run: node scripts/build-linux.mjs x64 arm64

      - name: 压缩单文件 + 打包 Node 轻量包
        working-directory: .
        run: |
          set -e
          for a in x64 arm64; do
            [ -f "dist/wag2api-linux-$a" ] && xz -9e -T0 -k "dist/wag2api-linux-$a"
          done
          cp -r app/app/src/main/assets/web src/web
          tar czf dist/wag2api-node.tar.gz src package.json LICENSE
          rm -rf src/web
          ls -la dist

      # 单文件版没有 --version/--help，直接启动后探活再杀掉
      - name: 冒烟测试
        working-directory: .
        run: |
          set +e
          chmod +x dist/wag2api-linux-x64
          DATA_DIR=/tmp/smoke PORT=18799 HOST=127.0.0.1 NO_AUTH=1 \
            ./dist/wag2api-linux-x64 > /tmp/smoke.log 2>&1 &
          APP_PID=$!
          OK=0
          for i in $(seq 1 20); do
            sleep 1
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18799/v1/models)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
          done
          kill $APP_PID 2>/dev/null
          wait $APP_PID 2>/dev/null
          cat /tmp/smoke.log
          if [ "$OK" = "1" ]; then
            echo "✅ 单文件版冒烟测试通过"
          else
            echo "::warning::单文件版冒烟测试未通过（不阻塞发布）"
          fi
          exit 0

      # 只上传压缩后的单文件和 Node 轻量包，原始二进制太大
      - name: 清理未压缩二进制
        run: rm -f dist/wag2api-linux-x64 dist/wag2api-linux-arm64 && ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ─────────────────────────────────────────────
  # 4. 发布：只在打 tag 时跑，且只调一次 action-gh-release
  # ─────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [apk, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 校验 tag 与版本号一致
        run: |
          set -e
          TAG=${GITHUB_REF_NAME#v}
          FILE_VER=$(grep '^VERSION_NAME=' app/version.properties | cut -d= -f2 | tr -d ' ')
          echo "tag=$TAG file=$FILE_VER"
          if [ "$TAG" != "$FILE_VER" ]; then
            echo "::error::tag ($TAG) 与 version.properties ($FILE_VER) 不一致"
            exit 1
          fi

      - name: 汇总产物并生成校验和
        run: |
          set -e
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.xz' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v2.* 在测试阶段一律发预发布
          prerelease: ${{ startsWith(github.ref_name, 'v2.') }}
