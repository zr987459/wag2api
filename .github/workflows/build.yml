name: Build wag2api

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 1. 引擎与路由单测
  # ─────────────────────────────────────────────
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node 引擎测试
        working-directory: .
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # 轻量编译检查：只编译 Kotlin，不打包不签名，约 40 秒
      # 这样推 main 也能拦住编译错误，不必等打 tag 才发现
      - name: Kotlin 编译检查
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileFullReleaseKotlin --no-daemon --console=plain

  # ─────────────────────────────────────────────
  # 2. APK：full + lite 一次出两个包
  # ─────────────────────────────────────────────
  apk:
    # 打 tag 或手动触发时出完整包；main 分支只做轻量编译检查
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # nodejs-mobile 只保留 arm64，只有 full 用得到
      - name: 缓存 nodejs-mobile
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: app/engine-node/libnode
          key: nodejs-mobile-18.20.4-arm64-v1

      - name: 下载 nodejs-mobile
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          URL=https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          curl -sSL -o /tmp/nm.zip "$URL"
          mkdir -p app/engine-node/libnode
          unzip -q /tmp/nm.zip -d app/engine-node/libnode
          rm -rf app/engine-node/libnode/bin/armeabi-v7a \
                 app/engine-node/libnode/bin/x86 \
                 app/engine-node/libnode/bin/x86_64

      # Node 核心由 Gradle 的 syncNodeCore（preBuild）自动同步，这里不再重复 cp

      # keystore：有 Secret 就用正式签名，没有就退回 debug
      - name: 解密 keystore
        env:
          KS_PW: ${{ secrets.KS_PW }}
        run: |
          if [ -z "$KS_PW" ]; then
            echo "::error::缺少 KS_PW，无法解密固定签名密钥，会导致每次签名不同、无法覆盖安装"
            exit 1
          fi
          mkdir -p app/keystore
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/keystore/release.p12.enc \
            -out app/keystore/release.p12 -pass env:KS_PW
          echo "密钥已解密"

      - name: 构建 full + lite
        working-directory: app
        env:
          KS_PW: ${{ secrets.KS_PW }}
          KS_ALIAS: ag
        run: |
          set -e
          chmod +x gradlew
          if [ ! -f keystore/release.p12 ]; then
            echo "::error::未找到解密的密钥库，无法保证固定签名"
            exit 1
          fi
          ./gradlew assembleFullRelease assembleLiteRelease --no-daemon --stacktrace

      # 签名硬校验：证书指纹必须与仓库变量一致，否则失败
      - name: 校验签名（full 与 lite 必须同签名）
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          FULL=$(ls app/app/build/outputs/apk/full/release/*.apk | head -1)
          LITE=$(ls app/app/build/outputs/apk/lite/release/*.apk | head -1)
          SHA_FULL=$("$BT" verify --print-certs "$FULL" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          SHA_LITE=$("$BT" verify --print-certs "$LITE" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "full: $SHA_FULL"
          echo "lite: $SHA_LITE"
          if [ "$SHA_FULL" != "$SHA_LITE" ]; then
            echo "::error::full 与 lite 签名不一致，无法互相覆盖安装"
            exit 1
          fi
          if [ -n "$EXPECTED" ]; then
            if [ "$SHA_FULL" != "$EXPECTED" ]; then
              echo "::error::签名指纹与 RELEASE_CERT_SHA256 不一致，会导致无法覆盖安装"
              exit 1
            fi
            echo "签名指纹校验通过"
          else
            echo "::notice::未配置 RELEASE_CERT_SHA256，已跳过指纹比对"
          fi
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}

      - name: 检查产物结构
        run: |
          set -e
          FULL=$(ls app/app/build/outputs/apk/full/release/*.apk | head -1)
          LITE=$(ls app/app/build/outputs/apk/lite/release/*.apk | head -1)
          echo "full: $FULL"; echo "lite: $LITE"
          if ! unzip -l "$FULL" | grep -q 'libnode.so'; then
            echo "::error::full 包缺少 libnode.so"; exit 1
          fi
          if unzip -l "$LITE" | grep -q 'libnode.so'; then
            echo "::error::lite 包不应包含 libnode.so"; exit 1
          fi
          if ! unzip -l "$FULL" | grep -q 'assets/gateway/src/server.mjs'; then
            echo "::error::full 包缺少 Node 核心"; exit 1
          fi
          echo "结构检查通过"

      - name: 重命名并上传
        run: |
          set -e
          mkdir -p dist
          cp $(ls app/app/build/outputs/apk/full/release/*.apk | head -1) dist/wag2api.apk
          cp $(ls app/app/build/outputs/apk/lite/release/*.apk | head -1) dist/wag2api-lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  # ─────────────────────────────────────────────
  # 3. Linux 单文件 + Node 轻量包
  # ─────────────────────────────────────────────
  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: 构建 Linux 产物
        working-directory: .
        run: node scripts/build-linux.mjs x64 arm64

      - name: 压缩单文件 + 打包 Node 轻量包
        working-directory: .
        run: |
          set -e
          for a in x64 arm64; do
            [ -f "dist/wag2api-linux-$a" ] && xz -9e -T0 -k "dist/wag2api-linux-$a"
          done
          cp -r app/app/src/main/assets/web src/web
          tar czf dist/wag2api-node.tar.gz src package.json LICENSE
          rm -rf src/web
          ls -la dist

      # 单文件版没有 --version/--help，直接启动后探活再杀掉
      - name: 冒烟测试
        working-directory: .
        run: |
          set +e
          chmod +x dist/wag2api-linux-x64
          DATA_DIR=/tmp/smoke PORT=18799 HOST=127.0.0.1 NO_AUTH=1 \
            ./dist/wag2api-linux-x64 > /tmp/smoke.log 2>&1 &
          APP_PID=$!
          OK=0
          for i in $(seq 1 20); do
            sleep 1
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18799/v1/models)
            if [ "$CODE" = "200" ]; then OK=1; break; fi
          done
          kill $APP_PID 2>/dev/null
          wait $APP_PID 2>/dev/null
          cat /tmp/smoke.log
          if [ "$OK" = "1" ]; then
            echo "✅ 单文件版冒烟测试通过"
          else
            echo "::warning::单文件版冒烟测试未通过（不阻塞发布）"
          fi
          exit 0

      # 只上传压缩后的单文件和 Node 轻量包，原始二进制太大
      - name: 清理未压缩二进制
        run: rm -f dist/wag2api-linux-x64 dist/wag2api-linux-arm64 && ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ─────────────────────────────────────────────
  # 4. 发布：只在打 tag 时跑，且只调一次 action-gh-release
  # ─────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [apk, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 校验 tag 与版本号一致
        run: |
          set -e
          TAG=${GITHUB_REF_NAME#v}
          FILE_VER=$(grep '^VERSION_NAME=' app/version.properties | cut -d= -f2 | tr -d ' ')
          echo "tag=$TAG file=$FILE_VER"
          if [ "$TAG" != "$FILE_VER" ]; then
            echo "::error::tag ($TAG) 与 version.properties ($FILE_VER) 不一致"
            exit 1
          fi

      - name: 汇总产物并生成校验和
        run: |
          set -e
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.xz' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
